<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Belajar</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

<style>
:root {
    --bg1: #FFD700;
    --bg2: #FFC300;
    --text: #1a1a1a;
    --card: rgba(255,255,255,0.38);
    --card-border: rgba(0,0,0,0.12);
    --particle: rgba(120,80,0,0.45);
    --sumber-bg: rgba(0,0,0,0.10);
    --sumber-text: #4a3200;
    --nahw-bg: rgba(255,255,255,0.45);
    --hover-bg: rgba(255,255,255,0.35);
    --line: #1a1a1a;
    --btn-bg: rgba(255,255,255,0.6);
}
[data-theme="dark"] {
    --bg1: #14110a;
    --bg2: #2a2210;
    --text: #f3e9c8;
    --card: rgba(255,255,255,0.06);
    --card-border: rgba(255,215,0,0.22);
    --particle: rgba(255,215,0,0.45);
    --sumber-bg: rgba(255,215,0,0.12);
    --sumber-text: #ffd84d;
    --nahw-bg: rgba(255,215,0,0.08);
    --hover-bg: rgba(255,215,0,0.10);
    --line: #ffd84d;
    --btn-bg: rgba(255,215,0,0.18);
}

body {
    margin: 0;
    padding: 40px 20px;
    font-family: "Times New Roman", serif;
    background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg1));
    background-size: 200% 200%;
    animation: shimmer 10s ease infinite;
    color: var(--text);
    overflow-x: hidden;
    transition: color 0.4s ease;
}

.container {
    max-width: 900px;
    margin: auto;
    position: relative;
    z-index: 1;
}

/* Tombol mode gelap */
#tema {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
    width: 42px;
    height: 42px;
    border: 1px solid var(--card-border);
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(6px);
}

/* Partikel */
.particle {
    position: fixed;
    width: 5px;
    height: 5px;
    background: var(--particle);
    border-radius: 50%;
    animation: float 12s linear infinite;
    z-index: 0;
    pointer-events: none;
}
@keyframes float {
    0%   { transform: translateY(100vh) scale(0.5); opacity: 0; }
    20%  { opacity: 0.9; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* Judul */
.judul {
    text-align: center;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 25px;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.8s ease;
}
.judul.show { opacity: 1; transform: translateY(0); }

/* Kartu per pelajaran */
.kartu {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 22px 20px 12px;
    margin-bottom: 28px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}

/* Subjudul */
.subjudul {
    position: relative;
    display: block;
    width: fit-content;
    margin: 0 auto 28px;
    text-align: center;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: bold;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.8s ease;
}
.subjudul.show { opacity: 1; transform: translateY(0); }
.subjudul::after {
    content: "";
    position: absolute;
    width: 0%;
    height: 3px;
    background: var(--line);
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);
    transition: 0.5s ease;
}
.subjudul:hover::after { width: 100%; }

/* Teks Arab */
.arab {
    font-family: 'Amiri', serif;
    direction: rtl;
    text-align: justify;
    text-align-last: right;
    font-size: clamp(18px, 4.5vw, 22px);
    line-height: 2.2;
    margin-bottom: 14px;
    padding: 8px 12px;
    border-radius: 10px;
    opacity: 0;
    transform: translateY(40px);
    transition: all 0.8s ease;
}
.arab.show { opacity: 1; transform: translateY(0); }
.arab:hover {
    background: var(--hover-bg);
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}
.arab:active { transform: scale(0.98); }

/* Baris sumber kitab */
.arab.sumber {
    background: var(--sumber-bg);
    color: var(--sumber-text);
    font-size: clamp(16px, 4vw, 19px);
    line-height: 2;
    border-right: 4px solid var(--line);
    text-align: right;
    text-align-last: right;
}

/* Baris contoh (نحو) */
.arab.nahw {
    background: var(--nahw-bg);
    border-right: 3px solid var(--sumber-text);
}

/* Bait syair */
.arab.syair {
    text-align: center;
    text-align-last: center;
    font-size: clamp(19px, 4.8vw, 24px);
    background: var(--nahw-bg);
    border: 1px dashed var(--card-border);
}
.arab.syair .syatr { display: inline-block; margin: 0 14px; }
.arab.syair .pemisah { opacity: 0.6; }

.kitab {
    font-weight: bold;
    transition: all 0.4s ease;
}
.kitab:hover {
    text-shadow: 0 0 16px var(--line);
    letter-spacing: 1px;
}

.error {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    padding: 20px;
}

@keyframes shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Cetak */
@media print {
    body { background: #fff !important; animation: none; color: #000; }
    .particle, #tema { display: none; }
    .judul, .subjudul, .arab { opacity: 1 !important; transform: none !important; }
    .kartu { box-shadow: none; backdrop-filter: none; break-inside: avoid; }
}
</style>
</head>

<body>

<button id="tema" aria-label="Ganti mode terang/gelap">🌙</button>

<!-- Particles -->
<div class="particle" style="left:5%;  animation-delay:0s;"></div>
<div class="particle" style="left:20%; animation-delay:2s;"></div>
<div class="particle" style="left:35%; animation-delay:4s;"></div>
<div class="particle" style="left:50%; animation-delay:1s;"></div>
<div class="particle" style="left:65%; animation-delay:3s;"></div>
<div class="particle" style="left:80%; animation-delay:5s;"></div>
<div class="particle" style="left:90%; animation-delay:6s;"></div>

<div class="container" id="konten"></div>

<script>
const JSON_URL = 'data.json';

/* ---------- Mode gelap ---------- */
const root = document.documentElement;
const tombol = document.getElementById('tema');

function setTema(t) {
    root.setAttribute('data-theme', t);
    tombol.textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('tema', t); } catch (e) {}
}
(function initTema() {
    let t = null;
    try { t = localStorage.getItem('tema'); } catch (e) {}
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    setTema(t);
})();
tombol.addEventListener('click', () =>
    setTema(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* ---------- Render ---------- */
function el(tag, className, text) {
    const e = document.createElement(tag);
    e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
}

// Bentuk baris Arab sesuai jenisnya (otomatis dari isi teks)
function barisIsi(teks) {
    if (teks.includes(' * ')) {                       // bait syair: syatr * syatr
        const [a, ...sisa] = teks.split(' * ');
        const row = el('div', 'arab syair');
        row.appendChild(el('span', 'syatr', a.trim()));
        row.appendChild(el('span', 'pemisah', '✦'));
        row.appendChild(el('span', 'syatr', sisa.join(' * ').trim()));
        return row;
    }
    const nahw = /^\s*نحو/.test(teks);                // contoh: نحو: ...
    return el('div', nahw ? 'arab nahw' : 'arab', teks);
}

function render(data) {
    const box = document.getElementById('konten');
    box.innerHTML = '';

    if (data.judul) {
        document.title = data.judul;
        box.appendChild(el('div', 'judul', data.judul));
    }

    (data.bagian || []).forEach(b => {
        const kartu = el('section', 'kartu');

        if (b.subjudul) kartu.appendChild(el('div', 'subjudul', b.subjudul));

        if (b.kitab) {
            const row = el('div', 'arab sumber');
            row.appendChild(el('span', 'kitab', b.kitab));
            if (b.sumber) row.appendChild(document.createTextNode(' ' + b.sumber));
            kartu.appendChild(row);
        }

        (b.isi || []).forEach(teks => kartu.appendChild(barisIsi(teks)));
        box.appendChild(kartu);
    });

    initReveal();
}

/* ---------- Animasi muncul (jeda tetap & singkat) ---------- */
function initReveal() {
    const items = document.querySelectorAll('.judul, .subjudul, .arab');
    const observer = new IntersectionObserver((entries, obs) => {
        let n = 0;
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const target = entry.target;
                setTimeout(() => target.classList.add('show'), n * 100);  // 0,1 dtk antar elemen
                n++;
                obs.unobserve(target);
            }
        });
    }, { threshold: 0.15 });
    items.forEach(i => observer.observe(i));
}

fetch(JSON_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(err => {
        document.getElementById('konten').appendChild(
            el('div', 'error', 'Gagal memuat ' + JSON_URL + '. Pastikan file ada di folder yang sama dan dibuka lewat server/hosting.')
        );
        console.error(err);
    });
</script>

</body>
</html>
