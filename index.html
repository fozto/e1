<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hasil Belajar</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

<style>
:root {
    --bg1: #FFD700;
    --bg2: #FFC300;
    --text: #1a1a1a;
    --card: rgba(255,255,255,0.38);
    --card-border: rgba(0,0,0,0.12);
    --particle: rgba(120,80,0,0.45);
    --sumber-bg: rgba(0,0,0,0.10);
    --sumber-text: #4a3200;
    --syair-bg: rgba(255,255,255,0.45);
    --hover-bg: rgba(255,255,255,0.35);
    --line: #1a1a1a;
    --btn-bg: rgba(255,255,255,0.6);
    --nav-bg: rgba(255,230,120,0.85);
}
[data-theme="dark"] {
    --bg1: #14110a;
    --bg2: #2a2210;
    --text: #f3e9c8;
    --card: rgba(255,255,255,0.06);
    --card-border: rgba(255,215,0,0.22);
    --particle: rgba(255,215,0,0.45);
    --sumber-bg: rgba(255,215,0,0.12);
    --sumber-text: #ffd84d;
    --syair-bg: rgba(255,215,0,0.08);
    --hover-bg: rgba(255,215,0,0.10);
    --line: #ffd84d;
    --btn-bg: rgba(255,215,0,0.18);
    --nav-bg: rgba(20,17,10,0.88);
}

body {
    margin: 0;
    padding: 40px 20px 110px;
    font-family: "Times New Roman", serif;
    background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg1));
    background-size: 200% 200%;
    animation: shimmer 10s ease infinite;
    color: var(--text);
    overflow-x: hidden;
    transition: color 0.4s ease;
}

.container {
    max-width: 900px;
    margin: auto;
    position: relative;
    z-index: 1;
    touch-action: pan-y;
}

/* Tombol mode gelap */
#tema {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
    width: 42px;
    height: 42px;
    border: 1px solid var(--card-border);
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(6px);
}

/* Partikel */
.particle {
    position: fixed;
    width: 5px;
    height: 5px;
    background: var(--particle);
    border-radius: 50%;
    animation: float 12s linear infinite;
    z-index: 0;
    pointer-events: none;
}
@keyframes float {
    0%   { transform: translateY(100vh) scale(0.5); opacity: 0; }
    20%  { opacity: 0.9; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* Judul */
.judul {
    text-align: center;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 25px;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.8s ease;
}
.judul.show { opacity: 1; transform: translateY(0); }

/* Kartu: satu pelajaran per layar */
.kartu {
    display: none;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 22px 20px 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.kartu.aktif { display: block; }
.kartu.dari-kanan { animation: masukKanan 0.4s ease; }
.kartu.dari-kiri  { animation: masukKiri 0.4s ease; }
@keyframes masukKanan { from { opacity: 0; transform: translateX(40px); }  to { opacity: 1; transform: none; } }
@keyframes masukKiri  { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }

/* Subjudul */
.subjudul {
    position: relative;
    display: block;
    width: fit-content;
    margin: 0 auto 28px;
    text-align: center;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: bold;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.8s ease;
}
.subjudul.show { opacity: 1; transform: translateY(0); }
.subjudul::after {
    content: "";
    position: absolute;
    width: 0%;
    height: 3px;
    background: var(--line);
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);
    transition: 0.5s ease;
}
.subjudul:hover::after { width: 100%; }

/* Teks Arab */
.arab {
    font-family: 'Amiri', serif;
    direction: rtl;
    text-align: justify;
    text-align-last: right;
    font-size: clamp(18px, 4.5vw, 22px);
    line-height: 2.2;
    margin-bottom: 14px;
    padding: 8px 12px;
    border-radius: 10px;
    opacity: 0;
    transform: translateY(40px);
    transition: all 0.8s ease;
}
.arab.show { opacity: 1; transform: translateY(0); }
.arab:hover {
    background: var(--hover-bg);
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}
.arab:active { transform: scale(0.98); }

.arab.sumber {
    background: var(--sumber-bg);
    color: var(--sumber-text);
    font-size: clamp(16px, 4vw, 19px);
    line-height: 2;
    border-right: 4px solid var(--line);
    text-align: right;
    text-align-last: right;
}

.arab.syair {
    text-align: center;
    text-align-last: center;
    font-size: clamp(19px, 4.8vw, 24px);
    background: var(--syair-bg);
    border: 1px dashed var(--card-border);
}
.arab.syair .syatr { display: inline-block; margin: 0 14px; }
.arab.syair .pemisah { opacity: 0.6; }

.kitab {
    font-weight: bold;
    transition: all 0.4s ease;
}
.kitab:hover {
    text-shadow: 0 0 16px var(--line);
    letter-spacing: 1px;
}

/* Navigasi bawah */
#nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--nav-bg);
    border-top: 1px solid var(--card-border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
#nav.siap { display: flex; }
#nav button.arah {
    flex: 0 0 auto;
    min-width: 110px;
    padding: 10px 14px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--btn-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
#nav button.arah:disabled { opacity: 0.35; cursor: default; }
#info {
    flex: 1 1 auto;
    text-align: center;
    max-width: 260px;
}
#nomor { font-weight: bold; font-size: 15px; }
#titik {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 6px;
}
#titik button {
    width: 9px;
    height: 9px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--text);
    opacity: 0.3;
    cursor: pointer;
}
#titik button.aktif { opacity: 1; transform: scale(1.3); }

.error {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    padding: 20px;
}

@keyframes shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@media (max-width: 480px) {
    #nav button.arah { min-width: 88px; font-size: 14px; padding: 9px 8px; }
}

/* Cetak: tampilkan semua pelajaran */
@media print {
    body { background: #fff !important; animation: none; color: #000; padding-bottom: 20px; }
    .particle, #tema, #nav { display: none !important; }
    .judul, .subjudul, .arab { opacity: 1 !important; transform: none !important; }
    .kartu { display: block !important; box-shadow: none; backdrop-filter: none; break-inside: avoid; margin-bottom: 20px; animation: none; }
}
</style>
</head>

<body>

<button id="tema" aria-label="Ganti mode terang/gelap">🌙</button>

<!-- Particles -->
<div class="particle" style="left:5%;  animation-delay:0s;"></div>
<div class="particle" style="left:20%; animation-delay:2s;"></div>
<div class="particle" style="left:35%; animation-delay:4s;"></div>
<div class="particle" style="left:50%; animation-delay:1s;"></div>
<div class="particle" style="left:65%; animation-delay:3s;"></div>
<div class="particle" style="left:80%; animation-delay:5s;"></div>
<div class="particle" style="left:90%; animation-delay:6s;"></div>

<div class="container" id="konten"></div>

<div id="nav">
    <button class="arah" id="prev">‹ Sebelumnya</button>
    <div id="info">
        <div id="nomor"></div>
        <div id="titik"></div>
    </div>
    <button class="arah" id="next">Berikutnya ›</button>
</div>

<script>
const JSON_URL = 'data.json';

/* ---------- Mode gelap ---------- */
const root = document.documentElement;
const tombolTema = document.getElementById('tema');

function setTema(t) {
    root.setAttribute('data-theme', t);
    tombolTema.textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('tema', t); } catch (e) {}
}
(function initTema() {
    let t = null;
    try { t = localStorage.getItem('tema'); } catch (e) {}
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    setTema(t);
})();
tombolTema.addEventListener('click', () =>
    setTema(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* ---------- Helper & render ---------- */
function el(tag, className, text) {
    const e = document.createElement(tag);
    e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
}

function barisIsi(teks) {
    if (teks.includes(' * ')) {                       // bait syair: syatr * syatr
        const [a, ...sisa] = teks.split(' * ');
        const row = el('div', 'arab syair');
        row.appendChild(el('span', 'syatr', a.trim()));
        row.appendChild(el('span', 'pemisah', '✦'));
        row.appendChild(el('span', 'syatr', sisa.join(' * ').trim()));
        return row;
    }
    return el('div', 'arab', teks);
}

let kartuList = [];
let titikList = [];
let sekarang = -1;

function render(data) {
    const box = document.getElementById('konten');
    box.innerHTML = '';

    if (data.judul) {
        document.title = data.judul;
        const j = el('div', 'judul', data.judul);
        box.appendChild(j);
        requestAnimationFrame(() => j.classList.add('show'));
    }

    kartuList = (data.bagian || []).map(b => {
        const kartu = el('section', 'kartu');
        if (b.subjudul) kartu.appendChild(el('div', 'subjudul', b.subjudul));
        if (b.kitab) {
            const row = el('div', 'arab sumber');
            row.appendChild(el('span', 'kitab', b.kitab));
            if (b.sumber) row.appendChild(document.createTextNode(' ' + b.sumber));
            kartu.appendChild(row);
        }
        (b.isi || []).forEach(teks => kartu.appendChild(barisIsi(teks)));
        box.appendChild(kartu);
        return kartu;
    });

    if (!kartuList.length) return;

    // Titik navigasi (disembunyikan jika pelajaran banyak)
    const titik = document.getElementById('titik');
    titik.innerHTML = '';
    titikList = [];
    if (kartuList.length <= 10) {
        kartuList.forEach((_, i) => {
            const t = document.createElement('button');
            t.setAttribute('aria-label', 'Pelajaran ' + (i + 1));
            t.addEventListener('click', () => tampil(i));
            titik.appendChild(t);
            titikList.push(t);
        });
    }

    document.getElementById('nav').classList.add('siap');

    // Pelajaran awal: dari #hash, lalu terakhir dibuka, lalu pertama
    let awal = parseInt(location.hash.replace('#', ''), 10) - 1;
    if (isNaN(awal)) {
        try { awal = parseInt(localStorage.getItem('pelajaran'), 10); } catch (e) {}
    }
    if (isNaN(awal) || awal < 0 || awal >= kartuList.length) awal = 0;
    tampil(awal, 0, true);
}

/* ---------- Tampilkan satu pelajaran ---------- */
function tampil(i, arah, tanpaScroll) {
    if (i < 0 || i >= kartuList.length || i === sekarang) return;
    if (arah === undefined) arah = i > sekarang ? 1 : -1;

    kartuList.forEach(k => k.classList.remove('aktif', 'dari-kanan', 'dari-kiri'));
    const kartu = kartuList[i];
    kartu.classList.add('aktif');
    if (arah !== 0) kartu.classList.add(arah > 0 ? 'dari-kanan' : 'dari-kiri');

    // Muncul berurutan dengan jeda tetap & singkat
    const items = kartu.querySelectorAll('.subjudul, .arab');
    items.forEach(it => it.classList.remove('show'));
    items.forEach((it, n) => setTimeout(() => it.classList.add('show'), 60 + Math.min(n, 12) * 70));

    sekarang = i;
    document.getElementById('nomor').textContent = (i + 1) + ' / ' + kartuList.length;
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === kartuList.length - 1;
    titikList.forEach((t, n) => t.classList.toggle('aktif', n === i));

    try { localStorage.setItem('pelajaran', i); } catch (e) {}
    history.replaceState(null, '', '#' + (i + 1));
    if (!tanpaScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('prev').addEventListener('click', () => tampil(sekarang - 1));
document.getElementById('next').addEventListener('click', () => tampil(sekarang + 1));

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  tampil(sekarang - 1);
    if (e.key === 'ArrowRight') tampil(sekarang + 1);
});

/* ---------- Geser di HP ---------- */
let x0 = 0, y0 = 0, t0 = 0;
const area = document.getElementById('konten');
area.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
}, { passive: true });
area.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if (Date.now() - t0 > 700) return;                       // bukan swipe cepat
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;  // harus dominan horizontal
    if (window.getSelection && String(window.getSelection())) return;    // sedang menyeleksi teks
    tampil(dx < 0 ? sekarang + 1 : sekarang - 1);            // geser kiri = berikutnya
}, { passive: true });

/* ---------- Muat data ---------- */
fetch(JSON_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(err => {
        document.getElementById('konten').appendChild(
            el('div', 'error', 'Gagal memuat ' + JSON_URL + '. Pastikan file ada di folder yang sama dan dibuka lewat server/hosting.')
        );
        console.error(err);
    });
</script>

</body>
</html>
